<!DOCTYPE html>

    <title>個人股票交易紀錄表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>

            <div>
                <h1 class="text-2xl font-bold text-gray-800">📈 股票進出紀錄表</h1>
                <p class="text-sm text-gray-500 mt-1">資料皆安全保存在您的瀏覽器中 (LocalStorage)</p>
            </div>
            <div class="text-right flex sm:block gap-6">
                <div>
                    <div class="text-sm text-gray-500">初始本金</div>

                </div>

                    <div class="text-sm text-gray-500 sm:mt-2">目前餘額</div>
                    <div id="current-balance" class="text-2xl font-bold text-blue-600">NT$ 300,000</div>
                </div>
            </div>
        </div>

                <input type="hidden" id="tx-id">

                        <option value="buy">🟢 買進</option>
                        <option value="sell">🔴 賣出</option>
                    </select>
